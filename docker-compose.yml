# HomeWard: web, worker and database. Run one worker only (see README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeward}
      POSTGRES_DB: ${POSTGRES_DB:-homeward}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-homeward} -d $${POSTGRES_DB:-homeward}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
    image: ghcr.io/${HOMEWARD_OWNER:-homeward}/homeward-web:${HOMEWARD_TAG:-latest}
    restart: unless-stopped
    # Each service gets only the settings it uses, not the whole .env.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeward}:${POSTGRES_PASSWORD:-homeward}@db:5432/${POSTGRES_DB:-homeward}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      MAX_SBOM_MB: ${MAX_SBOM_MB:-20}
      TZ: ${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./worker
    image: ghcr.io/${HOMEWARD_OWNER:-homeward}/homeward-worker:${HOMEWARD_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeward}:${POSTGRES_PASSWORD:-homeward}@db:5432/${POSTGRES_DB:-homeward}
      NVD_API_KEY: ${NVD_API_KEY:-}
      RESCAN_CRON: ${RESCAN_CRON:-0 3 * * *}
      TZ: ${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - trivy-cache:/var/cache/trivy
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy # web has run the migrations
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  trivy-cache:
