# HomeGuard: web, worker and database. Run one worker only (see README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeguard}
      POSTGRES_DB: ${POSTGRES_DB:-homeguard}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-homeguard} -d $${POSTGRES_DB:-homeguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/${HOMEGUARD_OWNER:-homeguard}/homeguard-web:${HOMEGUARD_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeguard}:${POSTGRES_PASSWORD:-homeguard}@db:5432/${POSTGRES_DB:-homeguard}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/${HOMEGUARD_OWNER:-homeguard}/homeguard-worker:${HOMEGUARD_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeguard}:${POSTGRES_PASSWORD:-homeguard}@db:5432/${POSTGRES_DB:-homeguard}
    volumes:
      - trivy-cache:/var/cache/trivy
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy # web has run the migrations
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  trivy-cache:
